<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Sharik · Owner dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f5;color:#16241d}
header{background:#0d3b2a;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header b{font-size:17px}
header .sp{flex:1}header input,header button{font:inherit;padding:6px 8px;border-radius:6px;border:0}
button{cursor:pointer}.btn{background:#13805a;color:#fff;border:0;padding:7px 12px;border-radius:6px}.btn.o{background:#fff;color:#13805a;border:1px solid #13805a}
nav{display:flex;gap:4px;padding:8px 20px;background:#fff;border-bottom:1px solid #dde5e0;overflow-x:auto}nav a{padding:7px 12px;border-radius:6px;color:#16241d;text-decoration:none;white-space:nowrap}nav a.on{background:#e3f2ea;color:#0d3b2a;font-weight:600}
main{padding:18px 20px;max-width:1300px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.k{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e1e8e4}.k small{color:#5d6d65;display:block;font-size:12px}.k b{font-size:20px}
.card{background:#fff;border-radius:10px;padding:14px;border:1px solid #e1e8e4;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eef2ef;vertical-align:top}th{color:#5d6d65;font-weight:600}
.lg{display:flex;gap:12px;font-size:12px;color:#5d6d65;margin-top:4px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.bad{color:#b42318;font-weight:600}.ok{color:#13805a;font-weight:600}.mut{color:#5d6d65}
#login{max-width:360px;margin:60px auto}#login input{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #cfd8d3;border-radius:6px;font:inherit}.err{color:#b42318}
.bar{height:22px;background:#13805a;border-radius:4px;color:#fff;font-size:12px;padding:2px 6px;white-space:nowrap;min-width:28px}
</style></head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="owner.js"></script>
</body></html>

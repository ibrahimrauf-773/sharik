<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Shareek · Owner dashboard</title>
<meta name="theme-color" content="#06231a"><link rel="icon" href="/icons/favicon-32.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/styles.css">
<style>
body{padding-bottom:30px;font-size:14px}
#root>header{position:sticky;top:0;z-index:20;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:#fff}#root>header b{font:700 19px var(--fd)}#root>header b::first-letter{color:var(--gold)}
header .sp{flex:1}header label{display:flex;gap:6px;align-items:center;margin:0;color:#cfe7dc;font-weight:500}header input,header button{font:inherit;min-height:38px;padding:6px 10px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;width:auto}header input::-webkit-calendar-picker-indicator{filter:invert(1)}
.btn{min-height:38px;padding:8px 14px;font-size:13.5px}
nav{display:flex;gap:6px;padding:10px 24px;background:var(--sf);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:62px;z-index:19;scrollbar-width:none}nav a{padding:8px 14px;border-radius:12px;color:var(--tx);white-space:nowrap;font-weight:500;transition:background .2s,transform .2s var(--spring)}nav a:hover{background:#13805a12}nav a.on{background:linear-gradient(180deg,var(--em2),var(--em));color:#fff;box-shadow:0 6px 16px -6px #0e5a43aa}
main{padding:22px 24px;max-width:1600px;margin:auto;animation:pagein .5s var(--spring) both}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.k{position:relative;overflow:hidden;background:var(--sf);backdrop-filter:blur(12px);border-radius:18px;padding:14px 16px;border:1px solid var(--bd);box-shadow:var(--sh)}.k::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;background:var(--geo);background-size:44px;opacity:.6}.k small{color:var(--mut);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.k b{font:650 24px var(--fd)}
.card{margin-bottom:18px;padding:18px}.card h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{overflow-x:auto}table{font-size:13px}th,td{padding:8px 10px;vertical-align:top;white-space:nowrap}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.bad{color:#c2410c;font-weight:600}.ok{color:var(--em2);font-weight:600}
#login{max-width:400px;margin:60px auto}#login input{margin:4px 0 10px}.err{color:#c2410c}
.bar{height:24px;background:linear-gradient(90deg,var(--em2),var(--em3));border-radius:8px;color:#fff;font-size:12px;padding:3px 8px;white-space:nowrap;min-width:28px;overflow:visible;margin:0;box-shadow:0 4px 12px -4px #13805a88;transform-origin:left;animation:fillbar 1s var(--spring) both}
@media(max-width:720px){#root>header{padding:10px 14px}nav{padding:8px 14px;top:auto;position:static}main{padding:14px}.kpis{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="root"></div>
<script src="/config.js"></script>
<script src="/owner.js"></script>
</body></html>
